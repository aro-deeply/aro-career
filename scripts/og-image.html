<!doctype html>
<!-- 링크 미리보기(OG) 이미지 원본. headless Chrome으로 1200x630 PNG를 만든다. 규칙은 docs/design/DESIGN.md(평가자의 펜 자국). -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'SUIT Variable';font-weight:100 900;src:url('../launch/public/fonts/SUIT-Variable.woff2') format('woff2')}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px}
body{background:#F4F4F1;color:#121214;font-family:'SUIT Variable',sans-serif;padding:64px 80px;display:flex;flex-direction:column;word-break:keep-all}
.meta{font-size:22px;color:#5E5E64;font-weight:600}
h1{margin-top:22px;font-weight:700;font-size:76px;line-height:1.22;letter-spacing:-.04em}
.sheet{margin-top:40px;align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:40px;background:#fff;border:1.5px solid #E3E3DF;border-radius:6px;padding:26px 32px}
.line{font-size:34px;font-weight:600;text-decoration:underline wavy #C2392B;text-decoration-thickness:2.5px;text-underline-offset:12px}
.note{font-size:24px;line-height:1.45;font-weight:700;color:#C2392B;padding-left:16px;border-left:3px solid #C2392B}
.foot{margin-top:auto;display:flex;align-items:center;font-size:22px;color:#5E5E64}
.foot b{color:#121214}
.url{margin-left:auto;font-weight:700;color:#121214}
</style>
</head>
<body>
  <p class="meta">ARO · 이력서 검토 메모</p>
  <h1>일은 해왔는데,<br>쓸 말이 없다면.</h1>
  <div class="sheet"><p class="line">고객 문의 응대 및 공지 관리</p><p class="note">무엇을 기준으로<br>처리했나요?</p></div>
  <p class="foot"><span>기업 HR <b>약 16년</b> · 채용·평가·교육</span><span class="url">aro-career.com</span></p>
</body>
</html>
